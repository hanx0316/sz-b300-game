<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SZ Buyer: B300 Quest (深圳买家像素版)</title>
    <!-- 引入 Phaser 3 游戏引擎 -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        /* 游戏内部对话框 UI Overlay */
        #dialog-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            background: rgba(17, 24, 39, 0.95);
            border: 2px solid #3b82f6;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            display: none;
            z-index: 100;
        }
        .dialog-title {
            color: #3b82f6;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }
        .dialog-text {
            font-size: 0.9rem;
            color: #e5e7eb;
            line-height: 1.5;
            margin-bottom: 12px;
        }
        .dialog-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .dialog-btn {
            background: #1f2937;
            color: #fff;
            border: 1px solid #374151;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: left;
        }
        .dialog-btn:active { background: #374151; }
    </style>
</head>
<body>

<div id="game-container"></div>

<!-- NPC 交互对话弹窗 -->
<div id="dialog-box">
    <div class="dialog-title" id="d-title">对话标题</div>
    <div class="dialog-text" id="d-text">对话内容...</div>
    <div class="dialog-options" id="d-options"></div>
</div>

<script>
    // 玩家数据与属性
    let gameState = {
        money: 5000000,
        trust: 50,
        sanity: 100,
        risk: 0,
        b300Count: 0
    };

    // Phaser 3 游戏全局配置
    const config = {
        type: Phaser.AUTO,
        width: 360,
        height: 640,
        parent: 'game-container',
        scale: {
            mode: Phaser.Scale.FIT,
            autoCenter: Phaser.Scale.CENTER_BOTH
        },
        physics: {
            default: 'arcade',
            arcade: { debug: false }
        },
        scene: {
            preload: preload,
            create: create,
            update: update
        }
    };

    const game = new Phaser.Game(config);
    let player;
    let cursors;
    let npcs;

    function preload() {
        // 使用程序化的像素纹理来模拟场景元素（无需外部图片加载）
        let graphics = this.make.graphics({x: 0, y: 0, add: false});

        // 1. 生成地面网格地板
        graphics.fillStyle(0x1e293b, 1);
        graphics.fillRect(0, 0, 360, 640);
        graphics.lineStyle(1, 0x334155, 0.5);
        for (let i = 0; i < 360; i += 40) {
            graphics.moveTo(i, 0); graphics.lineTo(i, 640);
        }
        for (let j = 0; j < 640; j += 40) {
            graphics.moveTo(0, j); graphics.lineTo(360, j);
        }
        graphics.generateTexture('bg_grid', 360, 640);

        // 2. 玩家小人 (蓝色像素小人)
        graphics.clear();
        graphics.fillStyle(0x3b82f6, 1);
        graphics.fillCircle(16, 16, 14);
        graphics.fillStyle(0xffffff, 1);
        graphics.fillCircle(20, 12, 3); // 眼睛
        graphics.generateTexture('player_sprite', 32, 32);

        // 3. 建筑/地点: 万象天地打铁咖啡 (红色)
        graphics.clear();
        graphics.fillStyle(0xef4444, 1);
        graphics.fillRoundedRect(0, 0, 80, 60, 8);
        graphics.generateTexture('loc_cafe', 80, 60);

        // 4. 建筑/地点: 华强北新亚洲 (黄色)
        graphics.clear();
        graphics.fillStyle(0xeab308, 1);
        graphics.fillRoundedRect(0, 0, 80, 60, 8);
        graphics.generateTexture('loc_hqb', 80, 60);

        // 5. 建筑/地点: 香港葵涌保税仓 (绿色)
        graphics.clear();
        graphics.fillStyle(0x10b981, 1);
        graphics.fillRoundedRect(0, 0, 80, 60, 8);
        graphics.generateTexture('loc_hk', 80, 60);
    }

    function create() {
        // 背景
        this.add.image(180, 320, 'bg_grid');

        // 绘制顶栏UI文本
        this.uiText = this.add.text(10, 10, '', {
            font: '12px monospace',
            fill: '#00ffcc',
            backgroundColor: '#000000b0',
            padding: { x: 8, y: 6 }
        });
        updateHUD.call(this);

        // 创建场景交互点 (NPC/建筑)
        npcs = this.physics.add.staticGroup();

        let cafe = npcs.create(70, 150, 'loc_cafe').setInteractive();
        cafe.sceneData = 'cafe';
        this.add.text(40, 140, '打铁咖啡\n[需求发布]', { font: '11px sans-serif', fill: '#ffffff', align: 'center' });

        let hqb = npcs.create(290, 300, 'loc_hqb').setInteractive();
        hqb.sceneData = 'hqb';
        this.add.text(260, 290, '华强北赛格\n[查验LOA]', { font: '11px sans-serif', fill: '#000000', align: 'center' });

        let hk = npcs.create(180, 500, 'loc_hk').setInteractive();
        hk.sceneData = 'hk';
        this.add.text(150, 490, '香港保税仓\n[算力交割]', { font: '11px sans-serif', fill: '#ffffff', align: 'center' });

        // 创建玩家
        player = this.physics.add.sprite(180, 320, 'player_sprite');
        player.setCollideWorldBounds(true);

        // 设置点击地图移动控制 (适配手机触摸屏)
        this.input.on('pointerdown', (pointer) => {
            // 如果对话框打开中，不响应移动
            if (document.getElementById('dialog-box').style.display === 'block') return;
            this.physics.moveToObject(player, pointer, 150);
        });

        // 碰撞触发对话
        this.physics.add.overlap(player, npcs, (p, npc) => {
            player.body.reset(player.x, player.y); // 停下动作
            openDialog(npc.sceneData);
        }, null, this);
    }

    function update() {
        // 靠近目标点自动停止
        if (player.body.speed > 0) {
            let distance = Phaser.Math.Distance.Between(player.x, player.y, player.body.destinationX || player.x, player.body.destinationY || player.y);
            if (distance < 5) player.body.reset(player.x, player.y);
        }
    }

    function updateHUD() {
        if (this.uiText) {
            this.uiText.setText(
                `资金: $${gameState.money.toLocaleString()}\n` +
                `精神值: ${gameState.sanity} | 合规风险: ${gameState.risk}%\n` +
                `B300台数: ${gameState.b300Count} / 64`
            );
        }
    }

    // 交互对话逻辑
    const dialogs = {
        cafe: {
            title: "南山打铁咖啡 (靠近触发)",
            text: "你走进了咖啡馆，微信群里瞬间涌入 50 个算力中介。有人声称手握‘英伟达直接配额’，要求你提供公司营业执照和资金证明。",
            options: [
                {
                    label: "【把资质发给中介】（风险极高）",
                    action: () => {
                        gameState.risk += 35;
                        gameState.sanity -= 15;
                        alert("你的营业执照被中介拿去外网空转套利，合规风险飙升！");
                        closeDialog();
                    }
                },
                {
                    label: "【进行 OSINT 背景调查】（核验底细）",
                    action: () => {
                        gameState.trust += 10;
                        gameState.sanity += 10;
                        alert("通过查验发现，中介公司域名上周刚注册且在海外已注销，成功识破假货源！");
                        closeDialog();
                    }
                }
            ]
        },
        hqb: {
            title: "华强北新亚洲 (靠近触发)",
            text: "炒货商给你掏出了一份盖满英文公章的 LOA 授权意向书，要求先付 $50 万订金。",
            options: [
                {
                    label: "【直接打款 $50 万订金】",
                    action: () => {
                        gameState.money -= 500000;
                        gameState.sanity -= 20;
                        alert("打款后中介退群失联，这只是个‘纸上算力’骗局！");
                        closeDialog();
                    }
                },
                {
                    label: "【要求现场进行 HBM 显存物理扫描】",
                    action: () => {
                        gameState.trust += 15;
                        alert("对方见你精通技术，心虚地收回了假合同。");
                        closeDialog();
                    }
                }
            ]
        },
        hk: {
            title: "香港葵涌保税仓 (靠近触发)",
            text: "到了终极交割环节，对方有真实 B300 现货，要求进行结算。",
            options: [
                {
                    label: "【走香港律所 Escrow 三方托管交割 16 台】",
                    action: () => {
                        gameState.money -= 2000000;
                        gameState.b300Count += 16;
                        alert("安全完成 16 台 B300 交割！集群成功启动！");
                        closeDialog();
                    }
                }
            ]
        }
    };

    function openDialog(key) {
        const d = dialogs[key];
        document.getElementById('d-title').innerText = d.title;
        document.getElementById('d-text').innerText = d.text;
        
        const optsContainer = document.getElementById('d-options');
        optsContainer.innerHTML = '';
        
        d.options.forEach(opt => {
            let btn = document.createElement('button');
            btn.className = 'dialog-btn';
            btn.innerText = opt.label;
            btn.onclick = () => {
                opt.action();
                // 刷新 HUD
                const scene = game.scene.scenes[0];
                updateHUD.call(scene);
            };
            optsContainer.appendChild(btn);
        });

        document.getElementById('dialog-box').style.display = 'block';
    }

    function closeDialog() {
        document.getElementById('dialog-box').style.display = 'none';
    }
</script>
</body>
</html>
